name: CD

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags:
      - 'v*'

jobs:
  deploy-stage:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-stage
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_INSTANCE_IDS: i-0373d39748d04d49b i-09ddde9020d7a94ca
      MONITORING_INSTANCE_ID: i-0373d39748d04d49b
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:968177690717:targetgroup/twinly-stage-api-tg/9a145ab64b8995bf
      DRAINING_RETRY_AFTER_MS: 60000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        working-directory: backend
        run: |
          docker build -t "$ECR_REGISTRY/twinly:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/twinly:$IMAGE_TAG"

      - name: Deploy API Instances Sequentially
        run: |
          BUNDLE_B64=$(tar czf - docker-compose.stage.yaml monitoring/cloudwatch-agent | base64 -w0)

          cat > /tmp/params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${BUNDLE_B64}' | base64 -d | tar xzf -",
              "if [ -f .env ]; then ADMIN_TOKEN=\$(grep '^ADMIN_API_TOKEN=' .env | cut -d= -f2-); curl -fsS -m 5 -X POST localhost:8080/admin/connection/draining -H \"X-Admin-Token: \$ADMIN_TOKEN\" -H 'Content-Type: application/json' -d '{\"reason\":\"deploy\",\"retryAfterMs\":${DRAINING_RETRY_AFTER_MS},\"scope\":\"local\"}' >/dev/null 2>&1 && echo 'draining 통보 완료' || echo 'draining 통보 생략 (앱 미기동 또는 호출 실패)'; sleep 3; fi",
              "aws ssm get-parameter --region ${AWS_REGION} --name /twinly/stage/api/env --with-decryption --query Parameter.Value --output text > .env.new",
              "grep -q '^JWT_SECRET_KEY=' .env.new",
              "chmod 600 .env.new",
              "mv .env.new .env",
              "sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env",
              "TOKEN=\$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')",
              "IID=\$(curl -s -H X-aws-ec2-metadata-token:\$TOKEN http://169.254.169.254/latest/meta-data/instance-id)",
              "echo INSTANCE_ID=\$IID >> .env",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose -f docker-compose.stage.yaml pull",
              "docker compose -f docker-compose.stage.yaml up -d",
              "timeout 180 bash -c 'until curl -fsS localhost:8081/actuator/health/readiness >/dev/null; do sleep 5; done'",
              "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/home/ubuntu/twinly/monitoring/cloudwatch-agent/config.json"
            ]
          }
          EOF

          for id in $API_INSTANCE_IDS; do
            echo "::group::${id} 배포"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --comment "deploy stage ${IMAGE_TAG}" \
              --parameters file:///tmp/params.json \
              --query Command.CommandId --output text)

            for _ in $(seq 1 60); do
              invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" 2>/dev/null || echo '{}')
              status=$(jq -r '.Status // "Pending"' <<< "$invocation")
              case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
              sleep 5
            done

            jq -r '.StandardOutputContent // ""' <<< "$invocation"
            jq -r '.StandardErrorContent // ""' <<< "$invocation"
            echo "::endgroup::"

            if [ "$status" != "Success" ]; then
              echo "::error::${id} 배포 실패 (${status}). 나머지 인스턴스는 이전 버전으로 유지됩니다."
              exit 1
            fi

            echo "${id} ALB 타겟이 healthy 가 될 때까지 대기"
            for _ in $(seq 1 40); do
              if ! health=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$id",Port=8080 \
                --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text); then
                echo "::error::${id} 타겟 상태 조회에 실패했습니다. 권한(elasticloadbalancing:DescribeTargetHealth) 또는 타겟 등록 여부를 확인하십시오."
                exit 1
              fi

              [ "$health" = "healthy" ] && break
              echo "  현재 ${health} — 재확인 대기"
              sleep 10
            done

            if [ "$health" != "healthy" ]; then
              echo "::error::${id} 가 400초 안에 healthy 가 되지 않았습니다 (마지막 상태: ${health}). 다음 인스턴스 배포를 중단합니다."
              exit 1
            fi

            echo "${id} healthy 확인 — 다음 인스턴스로 진행"
          done

      - name: Deploy Monitoring Stack
        run: |
          MONITORING_B64=$(tar czf - monitoring docker-compose.stage.monitoring.yaml | base64 -w0)

          cat > /tmp/monitoring-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${MONITORING_B64}' | base64 -d | tar xzf -",
              "docker compose -p twinly-monitoring -f docker-compose.stage.monitoring.yaml up -d",
              "timeout 120 bash -c 'until curl -fsS localhost:9090/-/ready >/dev/null; do sleep 5; done'",
              "timeout 120 bash -c 'until curl -fsS localhost:3000/api/health >/dev/null; do sleep 5; done'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $MONITORING_INSTANCE_ID \
            --document-name AWS-RunShellScript \
            --comment "deploy monitoring ${IMAGE_TAG}" \
            --parameters file:///tmp/monitoring-params.json \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$MONITORING_INSTANCE_ID" 2>/dev/null || echo '{}')
            status=$(jq -r '.Status // "Pending"' <<< "$invocation")
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "::group::${MONITORING_INSTANCE_ID} — ${status}"
          jq -r '.StandardOutputContent // ""' <<< "$invocation"
          jq -r '.StandardErrorContent // ""' <<< "$invocation"
          echo "::endgroup::"

          failed=0
          [ "$status" = "Success" ] || failed=1

          exit $failed

  deploy-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.sha }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_INSTANCE_IDS: i-08903483652243fec i-027f1e44635da471e
      MONITORING_INSTANCE_ID: i-0f9ae4a42137c72f9
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:968177690717:targetgroup/twinly-prod-api-tg/fdacee5d47c53f21
      DRAINING_RETRY_AFTER_MS: 60000

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify Image Exists
        run: |
          if ! aws ecr describe-images --repository-name twinly --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::${GITHUB_REF_NAME} 이 가리키는 커밋 ${IMAGE_TAG} 의 이미지가 ECR에 없습니다. main 에 머지되어 CI 가 통과한 커밋에만 태그를 다십시오."
            exit 1
          fi

          echo "배포 대상 이미지: twinly:${IMAGE_TAG} (${GITHUB_REF_NAME})"

      - name: Deploy API Instances Sequentially
        run: |
          BUNDLE_B64=$(tar czf - docker-compose.prod.yaml monitoring/cloudwatch-agent | base64 -w0)

          cat > /tmp/prod-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${BUNDLE_B64}' | base64 -d | tar xzf -",
              "if [ -f .env ]; then ADMIN_TOKEN=\$(grep '^ADMIN_API_TOKEN=' .env | cut -d= -f2-); curl -fsS -m 5 -X POST localhost:8080/admin/connection/draining -H \"X-Admin-Token: \$ADMIN_TOKEN\" -H 'Content-Type: application/json' -d '{\"reason\":\"deploy\",\"retryAfterMs\":${DRAINING_RETRY_AFTER_MS},\"scope\":\"local\"}' >/dev/null 2>&1 && echo 'draining 통보 완료' || echo 'draining 통보 생략 (앱 미기동 또는 호출 실패)'; sleep 3; fi",
              "aws ssm get-parameter --region ${AWS_REGION} --name /twinly/prod/api/env --with-decryption --query Parameter.Value --output text > .env.new",
              "grep -q '^JWT_SECRET_KEY=' .env.new",
              "chmod 600 .env.new",
              "mv .env.new .env",
              "sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env",
              "TOKEN=\$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')",
              "IID=\$(curl -s -H X-aws-ec2-metadata-token:\$TOKEN http://169.254.169.254/latest/meta-data/instance-id)",
              "echo INSTANCE_ID=\$IID >> .env",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose -f docker-compose.prod.yaml pull",
              "docker compose -f docker-compose.prod.yaml up -d",
              "timeout 180 bash -c 'until curl -fsS localhost:8081/actuator/health/readiness >/dev/null; do sleep 5; done'",
              "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/home/ubuntu/twinly/monitoring/cloudwatch-agent/config.json"
            ]
          }
          EOF

          for id in $API_INSTANCE_IDS; do
            echo "::group::${id} 배포"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --comment "deploy prod ${IMAGE_TAG}" \
              --parameters file:///tmp/prod-params.json \
              --query Command.CommandId --output text)

            for _ in $(seq 1 60); do
              invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" 2>/dev/null || echo '{}')
              status=$(jq -r '.Status // "Pending"' <<< "$invocation")
              case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
              sleep 5
            done

            jq -r '.StandardOutputContent // ""' <<< "$invocation"
            jq -r '.StandardErrorContent // ""' <<< "$invocation"
            echo "::endgroup::"

            if [ "$status" != "Success" ]; then
              echo "::error::${id} 배포 실패 (${status}). 나머지 인스턴스는 이전 버전으로 유지됩니다."
              exit 1
            fi

            echo "${id} ALB 타겟이 healthy 가 될 때까지 대기"
            for _ in $(seq 1 40); do
              if ! health=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$id",Port=8080 \
                --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text); then
                echo "::error::${id} 타겟 상태 조회에 실패했습니다. 권한(elasticloadbalancing:DescribeTargetHealth) 또는 타겟 등록 여부를 확인하십시오."
                exit 1
              fi

              [ "$health" = "healthy" ] && break
              echo "  현재 ${health} — 재확인 대기"
              sleep 10
            done

            if [ "$health" != "healthy" ]; then
              echo "::error::${id} 가 400초 안에 healthy 가 되지 않았습니다 (마지막 상태: ${health}). 다음 인스턴스 배포를 중단합니다."
              exit 1
            fi

            echo "${id} healthy 확인 — 다음 인스턴스로 진행"
          done

      - name: Deploy Monitoring Stack
        run: |
          MONITORING_B64=$(tar czf - monitoring docker-compose.prod.monitoring.yaml | base64 -w0)

          cat > /tmp/prod-monitoring-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${MONITORING_B64}' | base64 -d | tar xzf -",
              "aws ssm get-parameter --region ${AWS_REGION} --name /twinly/prod/monitoring/env --with-decryption --query Parameter.Value --output text > .env.new",
              "grep -q '^GRAFANA_ADMIN_PASSWORD=' .env.new",
              "chmod 600 .env.new",
              "mv .env.new .env",
              "docker compose -p twinly-monitoring -f docker-compose.prod.monitoring.yaml up -d",
              "timeout 120 bash -c 'until curl -fsS localhost:9090/-/ready >/dev/null; do sleep 5; done'",
              "timeout 120 bash -c 'until curl -fsS localhost:3000/api/health >/dev/null; do sleep 5; done'",
              "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/home/ubuntu/twinly/monitoring/cloudwatch-agent/config.json"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $MONITORING_INSTANCE_ID \
            --document-name AWS-RunShellScript \
            --comment "deploy prod monitoring ${IMAGE_TAG}" \
            --parameters file:///tmp/prod-monitoring-params.json \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$MONITORING_INSTANCE_ID" 2>/dev/null || echo '{}')
            status=$(jq -r '.Status // "Pending"' <<< "$invocation")
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "::group::${MONITORING_INSTANCE_ID} — ${status}"
          jq -r '.StandardOutputContent // ""' <<< "$invocation"
          jq -r '.StandardErrorContent // ""' <<< "$invocation"
          echo "::endgroup::"

          failed=0
          [ "$status" = "Success" ] || failed=1

          exit $failed
