name: CD

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy-stage:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-stage
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_IDS: i-0373d39748d04d49b i-09ddde9020d7a94ca
      MONITORING_INSTANCE_ID: i-0373d39748d04d49b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        working-directory: backend
        run: |
          docker build -t "$ECR_REGISTRY/twinly:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/twinly:$IMAGE_TAG"

      - name: Deploy to Instances
        run: |
          BUNDLE_B64=$(tar czf - docker-compose.stage.yaml monitoring/cloudwatch-agent | base64 -w0)

          cat > /tmp/params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${BUNDLE_B64}' | base64 -d | tar xzf -",
              "aws ssm get-parameter --region ${AWS_REGION} --name /twinly/stage/env --with-decryption --query Parameter.Value --output text > .env.new",
              "grep -q '^JWT_SECRET_KEY=' .env.new",
              "chmod 600 .env.new",
              "mv .env.new .env",
              "sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env",
              "TOKEN=\$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')",
              "IID=\$(curl -s -H X-aws-ec2-metadata-token:\$TOKEN http://169.254.169.254/latest/meta-data/instance-id)",
              "echo INSTANCE_ID=\$IID >> .env",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose -f docker-compose.stage.yaml pull",
              "docker compose -f docker-compose.stage.yaml up -d",
              "timeout 180 bash -c 'until curl -fsS localhost:8081/actuator/health >/dev/null; do sleep 5; done'",
              "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/home/ubuntu/twinly/monitoring/cloudwatch-agent/config.json"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)

          failed=0
          for id in $INSTANCE_IDS; do
            for _ in $(seq 1 60); do
              invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" 2>/dev/null || echo '{}')
              status=$(jq -r '.Status // "Pending"' <<< "$invocation")
              case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
              sleep 5
            done

            echo "::group::${id} — ${status}"
            jq -r '.StandardOutputContent // ""' <<< "$invocation"
            jq -r '.StandardErrorContent // ""' <<< "$invocation"
            echo "::endgroup::"

            [ "$status" = "Success" ] || failed=1
          done

          exit $failed

      - name: Deploy Monitoring Stack
        run: |
          MONITORING_B64=$(tar czf - monitoring docker-compose.monitoring.yaml | base64 -w0)

          cat > /tmp/monitoring-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/twinly",
              "echo '${MONITORING_B64}' | base64 -d | tar xzf -",
              "docker compose -f docker-compose.monitoring.yaml up -d",
              "timeout 120 bash -c 'until curl -fsS localhost:9090/-/ready >/dev/null; do sleep 5; done'",
              "timeout 120 bash -c 'until curl -fsS localhost:3000/api/health >/dev/null; do sleep 5; done'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $MONITORING_INSTANCE_ID \
            --document-name AWS-RunShellScript \
            --comment "deploy monitoring ${IMAGE_TAG}" \
            --parameters file:///tmp/monitoring-params.json \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            invocation=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$MONITORING_INSTANCE_ID" 2>/dev/null || echo '{}')
            status=$(jq -r '.Status // "Pending"' <<< "$invocation")
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          echo "::group::${MONITORING_INSTANCE_ID} — ${status}"
          jq -r '.StandardOutputContent // ""' <<< "$invocation"
          jq -r '.StandardErrorContent // ""' <<< "$invocation"
          echo "::endgroup::"

          failed=0
          [ "$status" = "Success" ] || failed=1

          exit $failed
