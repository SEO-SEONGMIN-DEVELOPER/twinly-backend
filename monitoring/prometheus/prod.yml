global:
  scrape_interval: 15s
  external_labels:
    env: prod

scrape_configs:
  - job_name: twinly-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.1.16.110:8081
        labels:
          env: prod
          node: api-a
      - targets:
          - 10.1.22.142:8081
        labels:
          env: prod
          node: api-c
