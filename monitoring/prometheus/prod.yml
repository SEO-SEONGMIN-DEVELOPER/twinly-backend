global:
  scrape_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: twinly-api
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Name
            values:
              - twinly-prod-api-*
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        regex: twinly-prod-(api-.+)
        target_label: node
      - target_label: env
        replacement: prod
