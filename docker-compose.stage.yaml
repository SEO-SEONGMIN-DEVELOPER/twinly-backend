services:
  app:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/twinly:${IMAGE_TAG:?IMAGE_TAG is not set}
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"