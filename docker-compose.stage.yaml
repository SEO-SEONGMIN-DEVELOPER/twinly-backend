services:
  app:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/twinly:${IMAGE_TAG:?IMAGE_TAG is not set}
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is not set}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:?JAVA_TOOL_OPTIONS is not set}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is not set}
      WS_HOST: ${WS_HOST:?WS_HOST is not set}
      DB_HOST: ${DB_HOST:?DB_HOST is not set}
      DB_PORT: ${DB_PORT:?DB_PORT is not set}
      DB_NAME: ${DB_NAME:?DB_NAME is not set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is not set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is not set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is not set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:?REDIS_SSL_ENABLED is not set}
      AES_KEY_V1: ${AES_KEY_V1:?AES_KEY_V1 is not set}
      HMAC_KEY: ${HMAC_KEY:?HMAC_KEY is not set}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is not set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is not set}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is not set}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is not set}
      BEDROCK_ACCESS_KEY_ID: ${BEDROCK_ACCESS_KEY_ID:?BEDROCK_ACCESS_KEY_ID is not set}
      BEDROCK_SECRET_ACCESS_KEY: ${BEDROCK_SECRET_ACCESS_KEY:?BEDROCK_SECRET_ACCESS_KEY is not set}
      BEDROCK_REGION: ${BEDROCK_REGION:?BEDROCK_REGION is not set}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:?BEDROCK_MODEL_ID is not set}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:?CLOUDFRONT_DOMAIN is not set}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:?CLOUDFRONT_KEY_PAIR_ID is not set}
      CLOUDFRONT_PRIVATE_KEY_BASE64: ${CLOUDFRONT_PRIVATE_KEY_BASE64:?CLOUDFRONT_PRIVATE_KEY_BASE64 is not set}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:?SES_ACCESS_KEY_ID is not set}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:?SES_SECRET_ACCESS_KEY is not set}
      SES_REGION: ${SES_REGION:?SES_REGION is not set}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:?SES_FROM_ADDRESS is not set}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:?SOLAPI_API_KEY is not set}
      SOLAPI_API_SECRET_KEY: ${SOLAPI_API_SECRET_KEY:?SOLAPI_API_SECRET_KEY is not set}
      SOLAPI_FROM_NUMBER: ${SOLAPI_FROM_NUMBER:?SOLAPI_FROM_NUMBER is not set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set}
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:?FCM_SERVICE_ACCOUNT_BASE64 is not set}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:?REVENUECAT_WEBHOOK_SECRET is not set}
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:?REVENUECAT_SECRET_API_KEY is not set}
      NICE_CLIENT_ID: ${NICE_CLIENT_ID:?NICE_CLIENT_ID is not set}
      NICE_CLIENT_SECRET: ${NICE_CLIENT_SECRET:?NICE_CLIENT_SECRET is not set}
      NICE_RETURN_URL: ${NICE_RETURN_URL:?NICE_RETURN_URL is not set}
      NICE_CLOSE_URL: ${NICE_CLOSE_URL:?NICE_CLOSE_URL is not set}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:?AI_SERVER_BASE_URL is not set}
    mem_limit: 900m
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is not set}
        awslogs-group: /twinly/stage/api
        awslogs-stream: ${INSTANCE_ID:?INSTANCE_ID is not set}
        mode: non-blocking
        max-buffer-size: 4m
