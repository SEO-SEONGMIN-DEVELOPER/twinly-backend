spring:
  flyway:
    locations: classpath:db/migration, classpath:db/seed

server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.nidus.twinly: INFO

verification:
  test:
    code: ${VERIFICATION_TEST_CODE:}
    phone-prefix: "0100000"
    email-prefix: "test"

revenue-cat:
  environment: PRODUCTION

seed:
  ai-test-users: true
  simulation-access-user-count: 0
