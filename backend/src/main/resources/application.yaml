app:
  current-season-id: 1

logging:
  file:
    name: logs/app.log

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: twinly
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DB}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: false

crypto:
  aes-keys:
    v1: ${AES_KEY_V1}
  current-version: v1
  hmac-key: ${HMAC_KEY}

aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
  bedrock:
    access-key-id: ${BEDROCK_ACCESS_KEY_ID}
    secret-access-key: ${BEDROCK_SECRET_ACCESS_KEY}
    region: ${BEDROCK_REGION}
    model-id: ${BEDROCK_MODEL_ID}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
    private-key-base64: ${CLOUDFRONT_PRIVATE_KEY_BASE64}
  ses:
    access-key-id: ${SES_ACCESS_KEY_ID}
    secret-access-key: ${SES_SECRET_ACCESS_KEY}
    region: ${SES_REGION}
    from-address: ${SES_FROM_ADDRESS}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret-key: ${SOLAPI_API_SECRET_KEY}
  from-number: ${SOLAPI_FROM_NUMBER}

jwt:
  secret-key: ${JWT_SECRET_KEY}