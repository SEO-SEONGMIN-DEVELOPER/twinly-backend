spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: twinly
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  crypto:
    aes-keys:
      v1: ${AES_KEY_V1}
    current-version: v1