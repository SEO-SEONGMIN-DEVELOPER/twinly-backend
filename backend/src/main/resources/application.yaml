admin:
  api-token: ${ADMIN_API_TOKEN:}

spring:
  application:
    name: twinly
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    mapper:
      accept-case-insensitive-enums: true

springdoc:
  override-with-generic-response: false
  paths-to-exclude: /docs/**
  api-docs:
    enabled: false
    path: /docs/openapi
  swagger-ui:
    enabled: false
    path: /docs/swagger-ui.html

springwolf:
  enabled: false
  path:
    base: /docs
    docs: /asyncapi
  docket:
    base-package: com.nidus.twinly
    info:
      title: Twinly WebSocket API
      version: 1.0.0
    servers:
      stomp:
        protocol: stomp
        host: ${WS_HOST}/ws/v1/
  plugin:
    stomp:
      endpoint:
        app: /app
        user: /user

crypto:
  aes-keys:
    v1: ${AES_KEY_V1}
  current-version: v1
  hmac-key: ${HMAC_KEY}

aws:
  s3:
    access-key-id: ${S3_ACCESS_KEY_ID}
    secret-access-key: ${S3_SECRET_ACCESS_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
  bedrock:
    access-key-id: ${BEDROCK_ACCESS_KEY_ID}
    secret-access-key: ${BEDROCK_SECRET_ACCESS_KEY}
    region: ${BEDROCK_REGION}
    model-id: ${BEDROCK_MODEL_ID}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
    private-key-base64: ${CLOUDFRONT_PRIVATE_KEY_BASE64}
  ses:
    access-key-id: ${SES_ACCESS_KEY_ID}
    secret-access-key: ${SES_SECRET_ACCESS_KEY}
    region: ${SES_REGION}
    from-address: ${SES_FROM_ADDRESS}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret-key: ${SOLAPI_API_SECRET_KEY}
  from-number: ${SOLAPI_FROM_NUMBER}

jwt:
  secret-key: ${JWT_SECRET_KEY}

revenue-cat:
  webhook-secret: ${REVENUECAT_WEBHOOK_SECRET}
  secret-api-key: ${REVENUECAT_SECRET_API_KEY}
  connect-timeout: 3s
  read-timeout: 5s
  sync-interval: 30s

nice:
  client-id: ${NICE_CLIENT_ID}
  client-secret: ${NICE_CLIENT_SECRET}
  return-url: ${NICE_RETURN_URL}
  close-url: ${NICE_CLOSE_URL}
  connect-timeout: 3s
  read-timeout: 7s
  token-refresh-margin: 1m

ai-server:
  base-url: ${AI_SERVER_BASE_URL}
  connect-timeout: 2s
  read-timeout: 3s

simulation:
  preload:
    days: 2
    max-attempts: 3
    retry-delay: 2s

app-block:
  cache-ttl: 5s

withdrawn-user-deletion:
  chunk-size: 500
  max-chunks: 100

websocket:
  heartbeat-interval: 25s

fcm:
  service-account-base64: ${FCM_SERVICE_ACCOUNT_BASE64}

anon:
  session-ttl: 14d

legal:
  base-url: https://trytwinly.com

parallel:
  relation-thresholds:
    enemy: 0
    stranger: 30
    awkward: 50
    close: 70
    best-friend: 85
  similarity-score:
    raw-mean: 0.457
    raw-std-dev: 0.084
    min: 10
    max: 99
    quantiles:
      - percentile: 0.10
        score: 30
      - percentile: 0.29
        score: 50
      - percentile: 0.51
        score: 70
      - percentile: 0.90
        score: 85

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
