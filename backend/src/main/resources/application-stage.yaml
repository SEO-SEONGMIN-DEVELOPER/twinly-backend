spring:
  flyway:
    locations: classpath:db/migration, classpath:db/seed
    out-of-order: true

server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.nidus.twinly: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

springwolf:
  enabled: true
  docket:
    servers:
      stomp:
        host: ${WS_HOST}/ws/v1/

verification:
  test:
    code: "000000"
    phone-prefix: "0100000"
    email-prefix: "test"

portone:
  allowed-channel-types: LIVE,TEST

revenue-cat:
  environment: SANDBOX
