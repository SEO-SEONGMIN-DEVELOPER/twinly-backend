plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nidus'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
    // General
    implementation 'org.springframework.boot:spring-boot-starter'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API docs - springdoc
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3")

    // AsyncAPI docs (WebSocket/STOMP) - springwolf
    implementation 'io.github.springwolf:springwolf-stomp:2.6.0'
    runtimeOnly 'io.github.springwolf:springwolf-ui:2.6.0'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // AWS
    implementation 'software.amazon.awssdk:s3:2.46.21'
    implementation 'software.amazon.awssdk:bedrockruntime:2.46.21'
    implementation 'software.amazon.awssdk:cloudfront:2.46.21'
    implementation 'software.amazon.awssdk:ses:2.46.21'

    // SOLAPI
    implementation("com.solapi:sdk:1.1.0")

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'   // 단위/슬라이스만 (빠름, Docker 불필요)
	}
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('integrationTest', Test) {
	description = '통합 테스트 (Testcontainers, Docker 필요)'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
	testLogging {
		events "passed", "skipped", "failed"
	}
}
