plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nidus'
version = '0.0.1'

repositories {
	mavenCentral()
}

dependencies {
    // General
    implementation 'org.springframework.boot:spring-boot-starter'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Health check
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // API docs - springdoc
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3")

    // AsyncAPI docs (WebSocket/STOMP) - springwolf
    implementation 'io.github.springwolf:springwolf-stomp:2.6.0'
    runtimeOnly 'io.github.springwolf:springwolf-ui:2.6.0'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Distributed lock
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.6.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.6.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // AWS
    implementation 'software.amazon.awssdk:s3:2.46.21'
    implementation 'software.amazon.awssdk:bedrockruntime:2.46.21'
    implementation 'software.amazon.awssdk:cloudfront:2.46.21'
    implementation 'software.amazon.awssdk:ses:2.46.21'

    // SOLAPI
    implementation("com.solapi:sdk:1.1.0")

    // Image
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'

    // FCM
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('unitTest', Test) {
	description = 'Unit Test (Docker 불필요)'
	group = 'verification'
	useJUnitPlatform {
		excludeTags 'integration', 'external'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'test'
	testLogging {
		events "passed", "skipped", "failed"
	}
}

tasks.named('test') {
	enabled = false
}

tasks.named('check') {
	dependsOn tasks.named('unitTest')
}

tasks.register('integrationTest', Test) {
	description = 'Integration Test (Testcontainers, Docker 필요)'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
		excludeTags 'external'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'test'
	shouldRunAfter tasks.named('unitTest')
	testLogging {
		events "passed", "skipped", "failed"
	}
}

tasks.register('externalTest', Test) {
	description = '실제 외부 API 호출 검증 (과금·발송 주의, 수동 실행 전용)'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'external'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'external'
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}
