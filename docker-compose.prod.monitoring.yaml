services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus-container-twinly
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prod.yml:/etc/prometheus/prometheus.yml:ro
      - promdata-twinly:/prometheus
    mem_limit: 400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana-container-twinly
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.trytwinly.com
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:?SLACK_ALERT_WEBHOOK_URL is not set}
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:?GRAFANA_DB_HOST is not set}
      GRAFANA_DB_PORT: ${GRAFANA_DB_PORT:?GRAFANA_DB_PORT is not set}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME:?GRAFANA_DB_NAME is not set}
      GRAFANA_DB_USERNAME: ${GRAFANA_DB_USERNAME:?GRAFANA_DB_USERNAME is not set}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD is not set}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata-twinly:/var/lib/grafana
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin-web:
    image: nginx:1.27.5-alpine
    container_name: admin-web-container-twinly
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is not set}
      ADMIN_API_UPSTREAM: ${ADMIN_API_UPSTREAM:?ADMIN_API_UPSTREAM is not set}
      ADMIN_WEB_RESOLVER: 127.0.0.11
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./admin-web/public:/usr/share/nginx/html:ro
      - ./admin-web/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared-container-twinly
    restart: unless-stopped
    depends_on:
      - grafana
      - admin-web
    command:
      - tunnel
      - --metrics=0.0.0.0:20241
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set}
    ports:
      - "127.0.0.1:20241:20241"
    mem_limit: 100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  promdata-twinly:
  grafanadata-twinly:
